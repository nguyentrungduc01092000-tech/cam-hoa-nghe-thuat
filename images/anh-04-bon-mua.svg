<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img">
<title>Sơ đồ bốn mùa hoa Việt Nam</title>
<desc>Bốn mùa: xuân có đào, mai, ban và mận; hạ có loa kèn, phượng, sen và hướng dương; thu có hoa sữa, tam giác mạch và cúc họa mi; đông có dã quỳ, cải trắng và mai anh đào.</desc>
<rect width="800" height="420" fill="#fdf8f0"/>
<text x="400" y="28" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#333">Bốn mùa hoa Việt Nam — mua theo mùa, theo dịp</text>
<g font-family="sans-serif" font-size="14" fill="#333">
<rect x="40" y="50" width="350" height="120" fill="#d5e8d4" stroke="#333"/><text x="215" y="80" text-anchor="middle">Xuân: đào, mai, ban, mận</text><text x="215" y="110" text-anchor="middle">Tháng 1–3 · Bắc và Tây Bắc</text><text x="215" y="140" text-anchor="middle">Đào cành mua trước Tết 3–5 ngày</text>
<rect x="410" y="50" width="350" height="120" fill="#fdebd0" stroke="#333"/><text x="585" y="80" text-anchor="middle">Hạ: loa kèn, phượng, sen</text><text x="585" y="110" text-anchor="middle">Tháng 4–8 · khắp cả nước</text><text x="585" y="140" text-anchor="middle">Sen mua trong ngày, cắm ngay</text>
<rect x="40" y="185" width="350" height="120" fill="#e8d5f2" stroke="#333"/><text x="215" y="215" text-anchor="middle">Thu: hoa sữa, tam giác mạch</text><text x="215" y="245" text-anchor="middle">cúc họa mi</text><text x="215" y="275" text-anchor="middle">Tháng 9–11 · Hà Nội, Hà Giang</text>
<rect x="410" y="185" width="350" height="120" fill="#d6eaf8" stroke="#333"/><text x="585" y="215" text-anchor="middle">Đông: dã quỳ, cải trắng</text><text x="585" y="245" text-anchor="middle">mai anh đào</text><text x="585" y="275" text-anchor="middle">Tháng 10–2 · Đà Lạt, Mộc Châu</text>
</g>
<text x="400" y="335" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">Mùa hoa xê dịch 1–2 tuần theo thời tiết — hỏi người bán hoa trong tuần đó.</text>
<text x="400" y="360" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#666">Sơ đồ chỉ minh họa bốn mùa.</text>
<text x="400" y="385" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#666">Dùng cho "Hoa theo mùa ở Việt Nam".</text>
</svg>
