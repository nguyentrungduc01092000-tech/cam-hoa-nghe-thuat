<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img">
<title>Sơ đồ bình cắm bằng lá và cành khô</title>
<desc>Sơ đồ tự vẽ, không phải ảnh chụp thật. Bình gốm nặng đựng cành khô và lá xanh: cành chính cao nhất lệch sang trái, cành thứ hai nghiêng ngược sang phải, lá xanh đan chéo miệng bình thành lưới đỡ, một bông hoa nhỏ làm điểm nhấn thấp hơn cành chính.</desc>
<rect width="800" height="440" fill="#fdf8f0"/>
<text x="400" y="30" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#333">Bình lá và cành khô: cành chính, cành ngược hướng, lưới lá đỡ</text>
<!-- vase -->
<g>
<path d="M330 330 L330 400 Q330 420 350 420 L450 420 Q470 420 470 400 L470 330 Q470 310 450 310 L350 310 Q330 310 330 330 Z" fill="#b08968" stroke="#333" stroke-width="2"/>
<text x="400" y="375" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#fff">Bình gốm nặng, đáy rộng</text>
</g>
<!-- main branch: tall, leaning left -->
<g stroke="#6b4f2a" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M400 315 C390 250 360 190 320 130"/>
<path d="M350 210 C330 200 315 195 300 190"/>
<path d="M365 170 C350 150 335 140 320 130"/>
</g>
<circle cx="320" cy="130" r="7" fill="#7a9e6d"/>
<circle cx="300" cy="190" r="6" fill="#7a9e6d"/>
<!-- second branch: opposite direction -->
<g stroke="#8a6d3b" stroke-width="4" fill="none" stroke-linecap="round">
<path d="M405 315 C420 260 450 210 490 165"/>
<path d="M445 225 C465 215 480 205 492 195"/>
</g>
<circle cx="490" cy="165" r="6" fill="#9db88a"/>
<!-- leaves forming grid across vase mouth -->
<g fill="#5b8c5a">
<ellipse cx="350" cy="300" rx="34" ry="12" transform="rotate(-25 350 300)"/>
<ellipse cx="430" cy="295" rx="34" ry="12" transform="rotate(20 430 295)"/>
<ellipse cx="395" cy="285" rx="30" ry="11" transform="rotate(-5 395 285)"/>
</g>
<!-- one small accent flower, lower than main branch -->
<g>
<line x1="400" y1="315" x2="440" y2="250" stroke="#4a7c59" stroke-width="3"/>
<circle cx="440" cy="245" r="12" fill="#e8a0a8" stroke="#333" stroke-width="1"/>
<circle cx="440" cy="245" r="4" fill="#f5d76e"/>
</g>
<g font-family="sans-serif" font-size="13" fill="#333">
<text x="60" y="120">Cành chính cao nhất,</text>
<text x="60" y="140">lệch khỏi tâm bình</text>
<text x="560" y="120">Cành thứ hai nghiêng</text>
<text x="560" y="140">ngược hướng</text>
<text x="560" y="280">Lá đan chéo miệng bình</text>
<text x="560" y="300">thành lưới đỡ lỏng</text>
<text x="60" y="280">Một bông hoa điểm,</text>
<text x="60" y="300">thấp hơn cành chính</text>
</g>
<text x="400" y="435" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#666">Cành cao nhất dài khoảng gấp rưỡi đến gấp đôi chiều cao bình. Sơ đồ tự vẽ bằng SVG, dùng cho Bài 19.</text>
</svg>
