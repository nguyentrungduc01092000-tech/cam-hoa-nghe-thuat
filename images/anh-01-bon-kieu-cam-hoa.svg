<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img">
<title>Sơ đồ bốn kiểu cắm hoa: tam giác, tròn, bán nguyệt, chữ L</title>
<desc>Sơ đồ tự vẽ, không phải ảnh chụp thật. Bốn ô minh họa hình dáng tổng thể của bốn kiểu cắm hoa.</desc>
<rect width="800" height="420" fill="#fdf8f0"/>
<text x="400" y="28" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#333">Bốn kiểu cắm hoa — sơ đồ minh họa, không phải ảnh chụp thật</text>
<g font-family="sans-serif" font-size="14" fill="#333">
<text x="100" y="70" text-anchor="middle">Tam giác</text>
<polygon points="100,90 60,180 140,180" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="100" cy="100" r="8" fill="#e74c3c"/><circle cx="80" cy="140" r="7" fill="#f39c12"/><circle cx="120" cy="140" r="7" fill="#e67e22"/><circle cx="65" cy="175" r="6" fill="#27ae60"/><circle cx="135" cy="175" r="6" fill="#27ae60"/>
<rect x="70" y="185" width="60" height="25" fill="#d5dbdb" stroke="#333"/>
<text x="100" y="235" text-anchor="middle">Cao ở giữa</text>
<text x="100" y="255" text-anchor="middle">thấp dần hai bên</text>
<text x="300" y="70" text-anchor="middle">Tròn</text>
<circle cx="300" cy="140" r="55" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="300" cy="100" r="8" fill="#e74c3c"/><circle cx="265" cy="125" r="7" fill="#f39c12"/><circle cx="335" cy="125" r="7" fill="#e67e22"/><circle cx="280" cy="165" r="7" fill="#27ae60"/><circle cx="320" cy="165" r="7" fill="#8e44ad"/>
<rect x="270" y="185" width="60" height="25" fill="#d5dbdb" stroke="#333"/>
<text x="300" y="235" text-anchor="middle">Đầy đều</text>
<text x="300" y="255" text-anchor="middle">quanh tâm</text>
<text x="500" y="70" text-anchor="middle">Bán nguyệt</text>
<path d="M 440 170 Q 500 90 560 170" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="500" cy="120" r="8" fill="#e74c3c"/><circle cx="460" cy="145" r="7" fill="#f39c12"/><circle cx="540" cy="145" r="7" fill="#e67e22"/><circle cx="445" cy="170" r="6" fill="#27ae60"/><circle cx="555" cy="170" r="6" fill="#27ae60"/>
<rect x="470" y="185" width="60" height="25" fill="#d5dbdb" stroke="#333"/>
<text x="500" y="235" text-anchor="middle">Cong như</text>
<text x="500" y="255" text-anchor="middle">lưỡi liềm</text>
<text x="700" y="70" text-anchor="middle">Chữ L</text>
<path d="M 700 90 L 700 180 L 760 180" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="700" cy="100" r="8" fill="#e74c3c"/><circle cx="700" cy="140" r="7" fill="#f39c12"/><circle cx="720" cy="180" r="7" fill="#e67e22"/><circle cx="755" cy="180" r="6" fill="#27ae60"/>
<rect x="670" y="185" width="60" height="25" fill="#d5dbdb" stroke="#333"/>
<text x="700" y="235" text-anchor="middle">Một nhánh dọc</text>
<text x="700" y="255" text-anchor="middle">một nhánh ngang</text>
</g>
<text x="400" y="320" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#666">Hình tròn đỏ, vàng, cam là hoa chính và hoa phụ; hình tròn xanh là lá. Sơ đồ chỉ minh họa hình dáng tổng thể.</text>
<text x="400" y="345" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#666">Dùng cho Bài 1. Nguồn: tự vẽ bằng SVG, không dùng ảnh mạng.</text>
</svg>
