<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img">
  <title>Sơ đồ phòng ngủ: vị trí nên đặt và nên tránh đặt bình hoa</title>
  <desc>Phòng ngủ nhìn từ trên xuống: cửa sổ ở tường trên, giường ở góc dưới trái, bàn trang điểm gần cửa sổ có bình hoa (nên đặt), bàn đầu giường cạnh giường chỉ đặt bình nhỏ và chắc chắn, lối đi ra cửa ở góc dưới phải (tránh đặt bình hoa).</desc>
  <rect x="10" y="10" width="620" height="400" fill="#f7f3ea" stroke="#8a7a5c" stroke-width="3"/>
  <rect x="240" y="4" width="160" height="12" fill="#bcd6e8" stroke="#5b7d99" stroke-width="2"/>
  <text x="320" y="34" text-anchor="middle" font-size="16" fill="#33506a">Cửa sổ</text>
  <rect x="40" y="240" width="200" height="150" fill="#dfe9f5" stroke="#5b7d99" stroke-width="2"/>
  <rect x="40" y="240" width="200" height="40" fill="#ffffff" stroke="#5b7d99" stroke-width="2"/>
  <text x="140" y="265" text-anchor="middle" font-size="15" fill="#33506a">Gối</text>
  <text x="140" y="330" text-anchor="middle" font-size="16" fill="#33506a">Giường</text>
  <rect x="250" y="240" width="70" height="60" fill="#efe3c8" stroke="#8a7a5c" stroke-width="2"/>
  <circle cx="285" cy="262" r="10" fill="#c98a7a" stroke="#7a4a3a" stroke-width="2"/>
  <text x="285" y="320" text-anchor="middle" font-size="14" fill="#5c4a2a">Bàn đầu giường</text>
  <text x="285" y="340" text-anchor="middle" font-size="13" fill="#7a5c00">chỉ khi bình nhỏ, chắc chắn</text>
  <rect x="440" y="40" width="150" height="70" fill="#efe3c8" stroke="#8a7a5c" stroke-width="2"/>
  <circle cx="470" cy="62" r="10" fill="#c98a7a" stroke="#7a4a3a" stroke-width="2"/>
  <text x="515" y="70" text-anchor="middle" font-size="15" fill="#2e6b34">NÊN ĐẶT</text>
  <text x="515" y="92" text-anchor="middle" font-size="14" fill="#33506a">Bàn trang điểm</text>
  <text x="515" y="130" text-anchor="middle" font-size="14" fill="#33506a">xa giường, gần cửa sổ</text>
  <rect x="440" y="240" width="150" height="150" fill="#f3e2e2" stroke="#a05a5a" stroke-width="2"/>
  <text x="515" y="300" text-anchor="middle" font-size="15" fill="#8a2f2f">TRÁNH</text>
  <text x="515" y="322" text-anchor="middle" font-size="14" fill="#5c2a2a">Lối đi ra cửa</text>
  <text x="515" y="344" text-anchor="middle" font-size="13" fill="#5c2a2a">dễ quệt ngã ban đêm</text>
  <text x="320" y="440" text-anchor="middle" font-size="14" fill="#555555">Khoảng cách từ bình hoa tới giường nên từ một mét trở lên.</text>
</svg>
