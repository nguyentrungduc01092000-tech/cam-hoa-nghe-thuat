<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img">
<title>Sơ đồ bố cục tối giản: bình thấp, ba cành cao thấp khác nhau, khoảng trống hai bên</title>
<desc>Sơ đồ được vẽ riêng cho website, không phải ảnh chụp thật. Bình thấp miệng hẹp đặt giữa, ba cành hoa cao thấp khác nhau tạo tam giác bất đối xứng, khoảng trống lớn hai bên là một phần của bố cục.</desc>
<rect width="800" height="420" fill="#fdf8f0"/>
<text x="400" y="28" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#333">Bố cục tối giản — bình thấp, 3 cành, khoảng trống</text>
<g font-family="sans-serif" font-size="13" fill="#333">
<rect x="330" y="300" width="140" height="70" fill="#d5e8d4" stroke="#333"/>
<text x="400" y="340" text-anchor="middle">Bình thấp</text>
<text x="400" y="360" text-anchor="middle">miệng hẹp</text>
<line x1="380" y1="300" x2="350" y2="110" stroke="#4a7c59" stroke-width="3"/>
<line x1="400" y1="300" x2="420" y2="180" stroke="#4a7c59" stroke-width="3"/>
<line x1="420" y1="300" x2="470" y2="240" stroke="#4a7c59" stroke-width="3"/>
<circle cx="350" cy="105" r="16" fill="#e8a0a8" stroke="#333"/>
<circle cx="420" cy="175" r="13" fill="#f2c14e" stroke="#333"/>
<circle cx="470" cy="235" r="11" fill="#e8a0a8" stroke="#333"/>
<text x="350" y="75" text-anchor="middle">Cành cao</text>
<text x="420" y="150" text-anchor="middle">Cành vừa</text>
<text x="470" y="215" text-anchor="middle">Cành thấp</text>
<text x="120" y="200" text-anchor="middle">Khoảng trống</text>
<text x="120" y="220" text-anchor="middle">là một phần</text>
<text x="120" y="240" text-anchor="middle">của bố cục</text>
<text x="680" y="200" text-anchor="middle">Khoảng trống</text>
<text x="680" y="220" text-anchor="middle">là một phần</text>
<text x="680" y="240" text-anchor="middle">của bố cục</text>
</g>
<text x="400" y="390" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#666">Ba cành cao thấp khác nhau tạo tam giác bất đối xứng. Sơ đồ: được vẽ riêng cho website bằng SVG.</text>
<text x="400" y="410" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#666">Dùng cho "Cắm hoa phong cách tối giản".</text>
</svg>
